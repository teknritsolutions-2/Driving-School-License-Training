<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - ApexDrive</title>
  <meta name="description" content="Sign in to your ApexDrive Student Dashboard. Review instructor written feedback, track completed behind-the-wheel hours, and schedule lessons.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo-mark.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom Design System -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body>
  <!-- Skip link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <main id="main-content" class="auth-wrapper">
    <div class="auth-card">
      
      <div class="auth-header">
        <a href="index.html" class="auth-logo-wrap">
          <img src="../assets/images/logo.svg" alt="ApexDrive" class="auth-logo brand-logo-svg" height="38">
        </a>
        <h1 class="h4 text-heading mb-1">Student Login</h1>
        <p class="text-muted small mb-0">Access your driving lesson logs, instructor feedback, and milestones.</p>
      </div>

      <!-- Clean Production Form -->
      <form class="needs-validation" novalidate action="dashboard/student-dashboard.html" method="get">
        <div class="mb-3">
          <label for="studentEmail" class="form-label">Email or Student ID</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="studentEmail" placeholder="Enter your email or student ID" required autocomplete="username">
            <div class="invalid-feedback">Please enter your student email or ID.</div>
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="studentPassword" class="form-label mb-0">Password</label>
            <a href="contact.html" class="small fw-semibold text-primary">Forgot Password?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="studentPassword" placeholder="Enter your password" required autocomplete="current-password">
            <button class="btn btn-outline-secondary password-toggle-btn" type="button" data-target="studentPassword" aria-label="Toggle password visibility">
              <i class="bi bi-eye-fill"></i>
            </button>
            <div class="invalid-feedback">Please enter your password.</div>
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="rememberMe" checked>
          <label class="form-check-label text-muted small" for="rememberMe">
            Remember this device for 30 days
          </label>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>

        <div class="text-center text-muted small mb-3">
          New student? <a href="register.html" class="text-primary fw-semibold">Enroll in a course here</a>
        </div>

        <div class="text-center pt-3 border-top">
          <a href="index.html" class="text-muted small d-inline-flex align-items-center gap-1">
            <i class="bi bi-house-door"></i> Home
          </a>
        </div>
      </form>

    </div>
  </main>

  <!-- Core Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
