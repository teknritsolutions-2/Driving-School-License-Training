<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon - ApexDrive</title>
  <meta name="description" content="Our new interactive driver theory simulator and mobile app are launching soon. Subscribe to receive early beta access and enrollment notifications.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo-mark.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom Design System -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body>
  <!-- Skip link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <main id="main-content" class="auth-wrapper">
    <div class="auth-card text-center" style="max-width: 580px;">
      
      <a href="index.html" class="d-inline-block mb-3">
        <img src="../assets/images/logo.svg" alt="ApexDrive" class="brand-logo-svg" height="42">
      </a>

      <span class="badge-apex badge-primary mb-2">In Final Pre-Flight Testing</span>
      <h1 class="h3 text-heading mb-2">New Virtual Driving Simulator</h1>
      <p class="text-muted small mb-4">
        We are putting the finishing touches on our 3D hazard perception simulator and mobile lesson booking application.
      </p>

      <!-- Countdown Timer Component -->
      <div class="row g-2 justify-content-center mb-4" id="comingSoonCountdown">
        <div class="col-3">
          <div class="p-3 bg-surface-alt rounded-3 border">
            <span class="d-block fw-bold text-primary fs-3" id="countDays">30</span>
            <span class="small text-muted text-uppercase" style="font-size: 0.75rem;">Days</span>
          </div>
        </div>
        <div class="col-3">
          <div class="p-3 bg-surface-alt rounded-3 border">
            <span class="d-block fw-bold text-primary fs-3" id="countHours">14</span>
            <span class="small text-muted text-uppercase" style="font-size: 0.75rem;">Hours</span>
          </div>
        </div>
        <div class="col-3">
          <div class="p-3 bg-surface-alt rounded-3 border">
            <span class="d-block fw-bold text-primary fs-3" id="countMinutes">45</span>
            <span class="small text-muted text-uppercase" style="font-size: 0.75rem;">Minutes</span>
          </div>
        </div>
        <div class="col-3">
          <div class="p-3 bg-surface-alt rounded-3 border">
            <span class="d-block fw-bold text-primary fs-3" id="countSeconds">22</span>
            <span class="small text-muted text-uppercase" style="font-size: 0.75rem;">Seconds</span>
          </div>
        </div>
      </div>

      <!-- Notification Form -->
      <form class="needs-validation mb-4" novalidate>
        <label for="notifyEmail" class="form-label small text-muted">Get notified on launch day &amp; receive priority enrollment:</label>
        <div class="input-group">
          <input type="email" class="form-control" id="notifyEmail" placeholder="Enter your email" required>
          <button class="btn btn-primary" type="submit">Notify Me</button>
          <div class="invalid-feedback text-start">Please enter a valid email.</div>
        </div>
      </form>

      <div class="pt-3 border-top">
        <a href="index.html" class="text-muted small d-inline-flex align-items-center gap-1">
          <i class="bi bi-house-door"></i> Home
        </a>
      </div>

    </div>
  </main>

  <!-- Core Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
