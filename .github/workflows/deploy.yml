name: Deploy Static Website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate deployment entry point redirect
        run: |
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=./pages/index.html">
            <title>ApexDrive Academy - Driving School &amp; License Training</title>
            <script>
              window.location.replace("./pages/index.html");
            </script>
          </head>
          <body style="font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 4rem 1rem; background: #0c1938; color: #ffffff;">
            <h2 style="margin-bottom: 0.5rem;">ApexDrive Academy</h2>
            <p style="color: #94a3b8;">Commercial Driving School &amp; License Training</p>
            <p style="margin-top: 1.5rem;"><a href="./pages/index.html" style="color: #60a5fa; text-decoration: underline;">Click here if you are not redirected automatically.</a></p>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
